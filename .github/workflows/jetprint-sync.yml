name: JetPrint order and SKU sync

on:
  schedule:
    - cron: "30 */6 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Sync JetPrint orders and check SKUs
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ vars.SITE_URL }}
          MAX_BATCHES: 20
          MAX_ATTEMPTS: 3
          RETRY_BACKOFF_SECONDS: 10
        run: |
          sync_endpoint() {
            local path="$1" count_field="$2"
            local endpoint="${SITE_URL%/}${path}"
            local cursor="" counted=0 failed=0 batch=0 attempt status

            while [ "$batch" -lt "$MAX_BATCHES" ]; do
              batch=$((batch + 1))
              attempt=0

              while true; do
                attempt=$((attempt + 1))
                rm -f response.json

                status=$(curl -sS --max-time 120 --get \
                  -H "Authorization: Bearer $CRON_SECRET" \
                  ${cursor:+--data-urlencode "cursor=$cursor"} \
                  -o response.json -w "%{http_code}" \
                  "$endpoint") || status="000"

                echo "--- $path batch $batch, attempt $attempt: HTTP $status"
                cat response.json 2>/dev/null || true
                echo

                if [ "$status" = "200" ]; then
                  break
                fi

                case "$status" in
                  000 | 429 | 5*) ;;
                  *)
                    echo "::error::$path returned HTTP $status"
                    return 1
                    ;;
                esac

                if [ "$attempt" -ge "$MAX_ATTEMPTS" ]; then
                  echo "::error::$path still failing after $MAX_ATTEMPTS attempts (HTTP $status)"
                  return 1
                fi

                sleep $((attempt * RETRY_BACKOFF_SECONDS))
              done

              if [ "$(jq -r '.status' response.json)" = "not-configured" ]; then
                echo "::warning::JetPrint is not configured; $path did nothing"
                return 0
              fi

              counted=$((counted + $(jq ".${count_field}" response.json)))
              failed=$((failed + $(jq '.failed | length' response.json)))
              cursor=$(jq -r '.nextCursor // empty' response.json)

              if [ -z "$cursor" ]; then
                break
              fi
            done

            echo "$path: $count_field $counted in $batch batch(es), $failed failed"

            if [ -n "$cursor" ]; then
              echo "::error::$path still unfinished after $MAX_BATCHES batches"
              return 1
            fi

            if [ "$failed" -gt 0 ]; then
              echo "::warning::$failed item(s) could not be read from JetPrint at $path; the next run retries them"
            fi
          }

          result=0
          sync_endpoint /api/cron/jetprint-sync synced || result=1
          sync_endpoint /api/cron/jetprint-variants checked || result=1
          exit "$result"
